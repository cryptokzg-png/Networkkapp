name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: |
          rm -rf /tmp/NetworkAndroid
          npx --no-install @react-native-community/cli init NetworkAndroid \
            --version 0.86.3 \
            --directory /tmp/NetworkAndroid \
            --title Networkkapp \
            --package-name com.tekou8.networkkapp \
            --skip-install \
            --pm npm
          rm -rf android
          cp -R /tmp/NetworkAndroid/android ./android

      - name: Validate React Native config
        run: |
          npx --no-install @react-native-community/cli config > /tmp/react-native-config.json
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('/tmp/react-native-config.json','utf8')); const a=c.project && c.project.android; if(!a || a.packageName!=='com.tekou8.networkkapp'){ console.error(JSON.stringify(c.project,null,2)); process.exit(1); } console.log('Android packageName:', a.packageName); console.log('Android sourceDir:', a.sourceDir);"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        timeout-minutes: 15
        run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Networkkapp-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
